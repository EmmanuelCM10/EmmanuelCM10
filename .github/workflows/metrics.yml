name: Metrics

on:
  # Atualiza diariamente à meia-noite (horário de Brasília)
  schedule:
    - cron: "0 3 * * *"
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar métricas do GitHub
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: EmmanuelCM10
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: no
          repositories_affiliations: owner
          config_timezone: America/Sao_Paulo
          config_order: base.header, base.activity, base.community, base.repositories, languages
          # Privacidade: só renderiza atividade de repos públicos, independente do escopo do METRICS_TOKEN
          plugin_activity: yes
          plugin_activity_visibility: public
          # Linguagens mais usadas
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%
